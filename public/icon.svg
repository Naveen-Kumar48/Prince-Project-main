<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer Navy Circle -->
  <circle cx="256" cy="256" r="248" fill="#0A1931" />
  <!-- Inner Yellow Circle -->
  <circle cx="256" cy="256" r="228" fill="#FFC800" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#0A1931" stroke-width="4" />
  
  <!-- Hanger -->
  <path d="M256 68 C256 48 276 42 286 52 C296 62 286 78 270 80" fill="none" stroke="#0A1931" stroke-width="8" stroke-linecap="round" />
  <path d="M165 140 L256 92 L347 140" fill="none" stroke="#0A1931" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Left Shirt (Blue) -->
  <path d="M160 132 L192 132 L202 195 L155 195 Z" fill="#0A1931" />
  <path d="M155 148 L138 162 L152 172 Z" fill="#0A1931" />
  
  <!-- Center Dress (Red) -->
  <path d="M238 132 L274 132 L288 198 L224 198 Z" fill="#D90429" />
  <path d="M245 120 L267 120 L260 132 L250 132 Z" fill="#D90429" />
  
  <!-- Right T-shirt (Blue with smile) -->
  <path d="M310 132 L347 132 L353 195 L305 195 Z" fill="#0A1931" />
  <circle cx="328" cy="158" r="11" fill="#FFC800" />
  <circle cx="324" cy="155" r="1.5" fill="#0A1931" />
  <circle cx="332" cy="155" r="1.5" fill="#0A1931" />
  <path d="M323 161 Q328 166 333 161" fill="none" stroke="#0A1931" stroke-width="1.5" stroke-linecap="round" />

  <!-- Red Divider Line -->
  <path d="M90 206 L422 206" stroke="#D90429" stroke-width="6" stroke-linecap="round" />
  <circle cx="84" cy="206" r="6" fill="#D90429" />
  <circle cx="428" cy="206" r="6" fill="#D90429" />
  
  <!-- Red Devanagari text AJAY -->
  <text x="256" y="298" font-family="'Arial Black', 'Impact', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="98" fill="#D90429" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke fill">अजय</text>
  
  <!-- Navy Blue Devanagari text READYMADE STORE -->
  <text x="256" y="368" font-family="'Arial Black', 'Impact', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="52" fill="#0A1931" text-anchor="middle">रेडीमेड स्टोर</text>
  
  <!-- Navy Pill Badge with English text -->
  <rect x="70" y="392" width="372" height="44" rx="22" fill="#0A1931" />
  <text x="256" y="422" font-family="'Arial Black', sans-serif" font-weight="900" font-size="21" text-anchor="middle">
    <tspan fill="#FFFFFF">AJAY </tspan>
    <tspan fill="#FFC800">READYMADE </tspan>
    <tspan fill="#FFFFFF">STORE</tspan>
  </text>
  
  <!-- Category bar -->
  <text x="256" y="462" font-family="sans-serif" font-weight="800" font-size="18" fill="#0A1931" text-anchor="middle" letter-spacing="1.5">MEN'S WEAR  |  LADIES WEAR  |  KIDS WEAR</text>

  <!-- Bottom Line -->
  <path d="M150 480 L362 480" stroke="#D90429" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="480" r="5" fill="#D90429" />
</svg>